<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kirby's Knockout Pool</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Calibri,Arial,sans-serif;font-size:15px}.wrap{width:min(900px,96%);margin:18px auto 40px}h1{margin:0;font-size:27px}.sub{font-size:13px;font-weight:700;margin:2px 0 12px}.notice{font-size:13px;font-weight:700;background:#fff200;border:1px solid #111;padding:7px 9px;margin-bottom:10px}.hidden{display:none!important}.pool{width:100%;border-collapse:collapse;table-layout:fixed}.pool td{border:1px solid #c8c8c8;padding:0;height:31px}.pool .name{width:42%;font-size:16px;font-weight:700;padding:0 7px;vertical-align:middle}.pool .x{width:6%;text-align:center;font-weight:700}.pool .team{width:52%;padding:0}.pickbox{width:100%;height:31px;border:0;border-radius:0;background:#fff;padding:3px 7px;font:inherit;font-weight:700}.pickbox:disabled{opacity:1;color:#000;background:#fff}.pickbox.win{background:#fff200!important}.pickbox.loss{background:#f00!important}.pickbox.hiddenpick{color:#555}.leader{margin:12px 0;border-collapse:collapse;width:100%}.leader th,.leader td{border:1px solid #aaa;padding:5px 7px;text-align:left}.leader th{background:#eee}.badge{display:inline-block;padding:2px 7px;border:1px solid #777;font-weight:700}.badge.two{background:#70ad47}.badge.one{background:#fff200}.badge.out{background:#f00}.entry{margin-top:14px;border-top:2px solid #111;padding:12px 12px 14px;background:#ff6a00;border:2px solid #111}.entry h2{font-size:18px;margin:0 0 6px}.msg{font-weight:700;margin:5px 0 9px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-weight:700}select,input,button{width:100%;border:1px solid #666;border-radius:0;background:#fff;padding:4px 7px;font:inherit}select,input,button{height:34px}button{font-weight:700;cursor:pointer}button.primary{background:#70ad47}.small{font-size:12px}.error{background:#f00;padding:7px 9px;margin:8px 0;font-weight:700}.ok{background:#70ad47;padding:7px 9px;margin:8px 0;font-weight:700}.big-arrow-wrap{position:relative;width:100%}.big-arrow-wrap .pickbox{padding-right:38px}.big-arrow-wrap::after{content:"▼";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:900;line-height:1;pointer-events:none;color:#000}@media(max-width:650px){.wrap{width:98%;margin-top:12px}.controls{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>KIRBY'S KNOCKOUT POOL</h1><div class="sub">NFL 2026 • PICK WINNERS • NO SPREAD</div><div class="notice">PICKS LOCK EVERY SUNDAY AT 1:00 PM EASTERN • PICKS ARE HIDDEN UNTIL THE LOCK</div>
<div id="statusMsg"></div><div id="leaderboard"></div><table class="pool"><tbody id="poolBody"></tbody></table>
<div id="entry" class="entry hidden"><h2 id="playerTitle"></h2><div id="playerMessage" class="msg"></div><div class="controls"><div><label for="pick1">1ST TEAM</label><select id="pick1"></select></div><div><label for="pick2">2ND TEAM</label><select id="pick2"></select></div></div><div style="margin-top:8px"><button id="saveBtn" class="primary">SAVE PICKS</button></div><div id="entryMsg" class="msg"></div></div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";const SUPABASE_URL="https://rkyupmpnsjjgditslpiz.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_hicUgD5WOhRlbPtwMzkaqQ_WktOF7qL",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const TEAMS=["Cardinals","Falcons","Ravens","Bills","Panthers","Bears","Bengals","Browns","Cowboys","Broncos","Lions","Packers","Texans","Colts","Jaguars","Chiefs","Raiders","Chargers","Rams","Dolphins","Vikings","Patriots","Saints","Giants","Jets","Eagles","Steelers","49ers","Seahawks","Buccaneers","Titans","Commanders"];const $=id=>document.getElementById(id);let players=[],myInfo=null,weekNumber=1,lockTime=null;
function tokenFromUrl(){const q=new URLSearchParams(location.search);return q.get("token")||new URLSearchParams(location.hash.substring(1)).get("token")||""}function nextSundayOnePM(){const d=new Date();const day=d.getDay(),days=(7-day)%7;d.setDate(d.getDate()+days);d.setHours(13,0,0,0);if(d<=new Date())d.setDate(d.getDate()+7);return d.toISOString()}function effectiveLockTime(){if(lockTime&&new Date(lockTime)>new Date())return lockTime;return nextSundayOnePM()}function isLocked(){return new Date(effectiveLockTime())<=new Date()}async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}function showStatus(t,type="ok"){const e=$("statusMsg");e.className=type;e.textContent=t;setTimeout(()=>{e.textContent="";e.className=""},5000)}
async function loadPublic(){const rows=await rpc("get_leaderboard",{})||[];players=rows;if(rows.length){if(rows[0].lock_time)lockTime=rows[0].lock_time;if(rows[0].week_number)weekNumber=rows[0].week_number}}async function loadMe(){const token=tokenFromUrl();if(!token){myInfo=null;return}const rows=await rpc("get_my_info",{p_token:token});myInfo=Array.isArray(rows)&&rows.length?rows[0]:null;if(myInfo){weekNumber=myInfo.week_number||weekNumber;if(myInfo.lock_time)lockTime=myInfo.lock_time}}
function resultClass(r){return r==="WIN"?"win":r==="LOSS"?"loss":"none"}function makePickSelect(p,slot,editable){const s=document.createElement("select");s.className="pickbox";const value=slot===1?p.team1:p.team2,other=slot===1?p.team2:p.team1,used=new Set(p.used_teams||[]);s.appendChild(new Option(editable?"SELECT TEAM":"PICK HIDDEN",""));TEAMS.forEach(t=>{const o=new Option(t,t);o.disabled=(used.has(t)&&t!==value)||t===other;if(t===value)o.selected=true;s.appendChild(o)});s.disabled=!editable;if(slot===1)s.classList.add(resultClass(p.team1_result));else s.classList.add(resultClass(p.team2_result));return s}
function renderLeaderboard(){const two=players.filter(p=>p.status!=="OUT"&&Number(p.picks_remaining)===2).length,one=players.filter(p=>p.status!=="OUT"&&Number(p.picks_remaining)===1).length,out=players.filter(p=>p.status==="OUT").length;$("leaderboard").innerHTML=`<table class="leader"><thead><tr><th colspan="2">LEADERBOARD</th></tr></thead><tbody><tr><td>2 PICKS</td><td><span class="badge two">${two}</span></td></tr><tr><td>1 PICK</td><td><span class="badge one">${one}</span></td></tr><tr><td>OUT</td><td><span class="badge out">${out}</span></td></tr></tbody></table>`}
function renderMain(){const body=$("poolBody");body.innerHTML="";const reveal=isLocked();players.forEach(p=>{if(p.status==="DROPPED")return;const r1=document.createElement("tr"),r2=document.createElement("tr"),name=document.createElement("td"),x=document.createElement("td");name.className="name"+(p.status==="OUT"?" out":"");name.rowSpan=2;name.textContent=p.name;x.className="x";x.rowSpan=2;x.textContent=p.status==="ACTIVE"?"x":"";const q={team1:reveal?p.team1||"":"",team2:reveal?p.team2||"":"",team1_result:reveal?p.team1_result||"":"",team2_result:reveal?p.team2_result||"":"",used_teams:p.used_teams||[],reveal};if(myInfo&&myInfo.name===p.name){Object.assign(q,{team1:myInfo.team1||"",team2:myInfo.team2||"",team1_result:myInfo.team1_result||"",team2_result:myInfo.team2_result||"",used_teams:myInfo.used_teams||[],reveal:true})}const c1=document.createElement("td"),c2=document.createElement("td");c1.className=c2.className="team";const s1=makePickSelect(q,1,false),s2=makePickSelect(q,2,false);if(!q.reveal){s1.value="";s2.value="";s1.classList.add("hiddenpick");s2.classList.add("hiddenpick")}c1.appendChild(s1);c2.appendChild(s2);r1.append(name,x,c1);r2.appendChild(c2);body.append(r1,r2)})}
function renderEntry(){const e=$("entry");if(!myInfo){e.classList.add("hidden");return}e.classList.remove("hidden");const locked=isLocked(),canEdit=!locked&&myInfo.status!=="OUT";$("playerTitle").textContent="PLAYER: "+String(myInfo.name).toUpperCase();$("playerMessage").textContent=myInfo.status==="OUT"?"You are OUT of the pool.":locked?"Picks are locked after Sunday at 1:00 PM Eastern.":"Choose your two teams. Your picks are stored in the database.";const p={team1:myInfo.team1||"",team2:myInfo.team2||"",team1_result:myInfo.team1_result||"",team2_result:myInfo.team2_result||"",used_teams:myInfo.used_teams||[],reveal:true};const s1=makePickSelect(p,1,canEdit),s2=makePickSelect(p,2,canEdit);s1.id="pick1";s2.id="pick2";const w1=document.createElement("div"),w2=document.createElement("div");w1.className=w2.className="big-arrow-wrap";w1.appendChild(s1);w2.appendChild(s2);$("pick1").replaceWith(w1);$("pick2").replaceWith(w2);$("saveBtn").disabled=!canEdit}
$("saveBtn").addEventListener("click",async()=>{if(!myInfo)return;const a=$("pick1").value,b=$("pick2").value;if(!a||!b){$("entryMsg").textContent="Please choose both teams.";return}if(a===b){$("entryMsg").textContent="Your two teams must be different.";return}try{const result=await rpc("submit_my_picks",{p_token:tokenFromUrl(),p_team1:a,p_team2:b});if(String(result).startsWith("error:"))throw new Error(result);$("entryMsg").textContent="Picks saved.";await refresh()}catch(e){$("entryMsg").textContent=e.message||"Could not save picks."}});
async function refresh(){await loadMe();await loadPublic();renderLeaderboard();renderMain();renderEntry()}(async()=>{try{await loadMe();await loadPublic();renderLeaderboard();renderMain();renderEntry()}catch(e){showStatus(e.message||"Could not connect to Supabase.","error")}})();
</script></body></html>
