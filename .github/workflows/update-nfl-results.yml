name: Update NFL Results

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current NFL results
        run: |
          python - <<'PY'
          import datetime, json, urllib.request
          today = datetime.date.today()
          results = {}
          for offset in range(-7, 2):
              d = today + datetime.timedelta(days=offset)
              url = f'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates={d:%Y%m%d}&limit=1000'
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = json.load(r)
              except Exception as e:
                  print('skip', d, e)
                  continue
              for ev in data.get('events', []):
                  comp = (ev.get('competitions') or [{}])[0]
                  st = ev.get('status', {}).get('type', {})
                  if not (st.get('completed') or st.get('state') == 'post' or 'FINAL' in str(st.get('name','')).upper()):
                      continue
                  teams = comp.get('competitors') or []
                  if len(teams) < 2:
                      continue
                  try:
                      a,b = teams[0],teams[1]
                      sa,sb = float(a.get('score')),float(b.get('score'))
                  except Exception:
                      continue
                  if sa == sb:
                      continue
                  winner, loser = (a,b) if sa > sb else (b,a)
                  for t,res in ((winner,'WIN'),(loser,'LOSS')):
                      team = t.get('team') or {}
                      names = [team.get('displayName'),team.get('shortDisplayName'),team.get('name'),team.get('abbreviation')]
                      for name in names:
                          if name:
                              key = ' '.join(str(name).lower().split())
                              results[key] = res
          out = {'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'results': results}
          with open('nfl-results.json','w') as f:
              json.dump(out,f,indent=2,sort_keys=True)
          print('results:', len(results))
          PY

      - name: Commit updated results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nfl-results.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update NFL results'
          git push
