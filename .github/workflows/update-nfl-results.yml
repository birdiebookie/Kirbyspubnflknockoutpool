name: Update NFL Results

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current NFL results
        run: |
          python - <<'PY'
          import datetime, json, urllib.request
          from zoneinfo import ZoneInfo

          ET = ZoneInfo('America/New_York')
          START = datetime.datetime(2026, 9, 10, tzinfo=ET)
          path = 'nfl-results.json'

          try:
              with open(path) as f:
                  existing = json.load(f)
          except Exception:
              existing = {}

          weeks = existing.get('weeks') or {}

          today = datetime.date.today()
          for offset in range(-7, 2):
              d = today + datetime.timedelta(days=offset)
              url = f'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates={d:%Y%m%d}&limit=1000'
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data = json.load(r)
              except Exception as e:
                  print('skip', d, e)
                  continue

              for ev in data.get('events', []):
                  comp = (ev.get('competitions') or [{}])[0]
                  st = ev.get('status', {}).get('type', {})
                  if not (st.get('completed') or st.get('state') == 'post' or 'FINAL' in str(st.get('name','')).upper()):
                      continue

                  teams = comp.get('competitors') or []
                  if len(teams) < 2:
                      continue
                  try:
                      a, b = teams[0], teams[1]
                      sa, sb = float(a.get('score')), float(b.get('score'))
                  except Exception:
                      continue
                  if sa == sb:
                      continue

                  game_date = datetime.datetime.fromisoformat(ev.get('date','').replace('Z','+00:00'))
                  game_week = ((game_date.astimezone(ET).date() - START.date()).days // 7) + 1
                  if game_week < 1 or game_week > 18:
                      continue

                  bucket = weeks.setdefault(str(game_week), {})
                  winner, loser = (a, b) if sa > sb else (b, a)
                  for t, res in ((winner, 'WIN'), (loser, 'LOSS')):
                      team = t.get('team') or {}
                      names = [
                          team.get('displayName'),
                          team.get('shortDisplayName'),
                          team.get('name'),
                          team.get('abbreviation')
                      ]
                      for name in names:
                          if name:
                              key = ' '.join(str(name).lower().split())
                              bucket[key] = res

          # Confirmed official correction: Detroit won Week 1.
          weeks.setdefault('1', {})['det'] = 'WIN'
          weeks['1']['detroit lions'] = 'WIN'
          weeks['1']['lions'] = 'WIN'

          # Backward compatibility: results always represents Week 1.
          week1 = weeks.get('1', {})
          out = {
              'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'results': week1,
              'weeks': weeks
          }

          with open(path, 'w') as f:
              json.dump(out, f, indent=2, sort_keys=True)

          print('weeks:', {k: len(v) for k, v in weeks.items()})
          PY

      - name: Commit updated results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nfl-results.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update NFL results'
          git push
