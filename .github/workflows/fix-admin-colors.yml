name: Fix admin colors
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin result colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='.adminTable input,.adminTable select{height:30px}'
          new='.adminTable input,.adminTable select{height:30px}.adminTable select.win{background:#fff200!important}.adminTable select.loss{background:#f00!important}.adminTable select.pending{background:#fff!important}'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix admin result colors'
          git push
