<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Kirby's Knockout Pool — Leaderboard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Calibri,Arial,sans-serif;font-size:15px}.wrap{width:min(1200px,98%);margin:18px auto 40px}h1{font-size:30px;margin:0}.sub{font-size:15px;font-weight:700;margin:2px 0 12px}.notice{font-size:14px;font-weight:700;background:#fff200;border:1px solid #111;padding:9px 10px;margin-bottom:12px}.top{margin-bottom:12px}.back{display:inline-block;border:1px solid #666;background:#eee;color:#000;text-decoration:none;font-weight:700;padding:10px 14px}.tableWrap{width:100%;overflow-x:auto;border:1px solid #777}.sheet{width:100%;min-width:900px;border-collapse:collapse;table-layout:fixed}.sheet th,.sheet td{border:1px solid #777;padding:0;text-align:left;font-weight:700}.sheet thead th{background:#eee;padding:8px}.group{font-size:21px;font-weight:900!important;text-align:center!important;padding:10px!important}.group.w1{background:#fff200!important}.group.current{background:#70ad47!important}.playerHead{width:20%}.weekHead{width:30%}.statusHead{width:10%}.pickslot{min-height:38px;padding:7px 8px;border-bottom:1px solid #777;background:#fff;text-align:center}.pickslot:last-child{border-bottom:0}.win{background:#fff200!important}.loss{background:#f00!important}.pending{background:#fff!important}.picked{background:#70ad47!important}.statusCell{text-align:center!important;font-size:16px;padding:8px!important}.out{background:#f00!important}.legend{margin-top:12px;font-weight:700}.legend span{display:inline-block;padding:4px 9px;border:1px solid #777;margin-right:6px}.yellow{background:#fff200}.red{background:#f00}.green{background:#70ad47}.white{background:#fff}.msg{font-weight:700;margin:10px 0}</style></head>
<body><div class="wrap"><h1>KIRBY'S KNOCKOUT POOL</h1><div class="sub">NFL 2026 • LIVE LEADERBOARD</div><div class="top"><a id="back" class="back" href="./">← BACK TO MY PICKS</a></div><div id="notice" class="notice">LOADING LEADERBOARD...</div><div id="msg" class="msg"></div><div id="weeks"></div><div class="legend"><span class="yellow">WIN</span><span class="red">LOSS</span><span class="green">PICKED</span><span class="white">PENDING</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const SUPABASE_URL="https://rkyupmpnsjjgditslpiz.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_hicUgD5WOhRlbPtwMzkaqQ_WktOF7qL",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);
async function rpc(name,args){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
function tokenFromUrl(){const q=new URLSearchParams(location.search);return q.get("token")||new URLSearchParams(location.hash.substring(1)).get("token")||""}
function cleanTeam(s){return String(s||"").replace(/\s+[-+]\d+(?:\.\d+)?\s*$/g,"").replace(/\s+/g," ").trim().toLowerCase()}
function addResult(results,name,res){if(!name)return;const k=cleanTeam(name);if(k)results[k]=res}
function nflWeekFromDate(dateString){const d=new Date(dateString);if(Number.isNaN(d.getTime()))return 0;const seasonStart=new Date("2026-09-10T00:00:00-04:00");return Math.floor((d.getTime()-seasonStart.getTime())/(7*86400000))+1}
async function fetchLiveNFLResults(){
 const byWeek={};
 try{
  const now=new Date(),from=new Date(now.getTime()-35*86400000),to=new Date(now.getTime()+1*86400000),fmt=d=>d.toISOString().slice(0,10).replaceAll("-","");
  const url=`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${fmt(from)}-${fmt(to)}&limit=1000`;
  const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("ESPN HTTP "+r.status);const data=await r.json();
  for(const ev of(data.events||[])){
   const st=ev.status?.type||{};
   if(!(st.completed||st.state==="post"||String(st.name||"").toUpperCase().includes("FINAL")))continue;
   const gameDate=new Date(ev.date);if(Number.isNaN(gameDate.getTime())||gameDate>now)continue;
   const teams=ev.competitions?.[0]?.competitors||[];if(teams.length<2)continue;
   const a=teams[0],b=teams[1],sa=Number(a.score),sb=Number(b.score);if(!Number.isFinite(sa)||!Number.isFinite(sb)||sa===sb)continue;
   const wk=nflWeekFromDate(ev.date);if(wk<1||wk>18)continue;
   if(!byWeek[wk])byWeek[wk]={};
   const winner=sa>sb?a:b,loser=sa>sb?b:a,wx=winner.team||{},lx=loser.team||{};
   [wx.displayName,wx.shortDisplayName,wx.name,wx.abbreviation].forEach(n=>addResult(byWeek[wk],n,"WIN"));
   [lx.displayName,lx.shortDisplayName,lx.name,lx.abbreviation].forEach(n=>addResult(byWeek[wk],n,"LOSS"));
  }
 }catch(e){console.warn("Live ESPN results unavailable",e)}
 return byWeek
}
async function fetchStoredResults(){try{const r=await fetch("./nfl-results.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();return(await r.json()).results||{}}catch(e){return{}}}
function resultForTeam(team,results){const k=cleanTeam(team);if(!k)return"";if(results[k])return results[k];for(const x of Object.keys(results)){const y=cleanTeam(x);if(k===y||k.endsWith(" "+y)||y.endsWith(" "+k))return results[x]}return""}
function makePick(team,result){const d=document.createElement("div"),r=String(result||"").trim().toUpperCase();d.className="pickslot pending";d.textContent=team||"Pending";if(r==="WIN")d.className="pickslot win";else if(r==="LOSS")d.className="pickslot loss";return d}
function pickData(p,week,weekResults,storedResults,isCurrent){
 const team1=p?.team1||"",team2=p?.team2||"";
 // CRITICAL: the current week's picks may NEVER inherit a result from an earlier week.
 // Only a result explicitly attached to this exact pick row may color the current week.
 if(isCurrent){
  const r1=String(p?.team1_result||"").trim().toUpperCase(),r2=String(p?.team2_result||"").trim().toUpperCase();
  return{team1,team2,r1:(r1==="WIN"||r1==="LOSS")?r1:"",r2:(r2==="WIN"||r2==="LOSS")?r2:""};
 }
 let r1=team1?resultForTeam(team1,weekResults):"",r2=team2?resultForTeam(team2,weekResults):"";
 if(!r1)r1=String(p?.team1_result||"").trim().toUpperCase();if(!r2)r2=String(p?.team2_result||"").trim().toUpperCase();
 if(week===1){if(team1&&!r1)r1=resultForTeam(team1,storedResults);if(team2&&!r2)r2=resultForTeam(team2,storedResults)}
 return{team1,team2,r1,r2}
}
function statusFor(d,isCurrent){const has1=!!d.team1,has2=!!d.team2;if(isCurrent)return has1||has2?"PICKED":"PENDING";const f1=!!d.r1,f2=!!d.r2,w=(d.r1==="WIN"?1:0)+(d.r2==="WIN"?1:0);if(!has1&&!has2)return"PENDING";if(!f1||!f2)return"1 PICK";return w===0?"OUT":w===1?"1 PICK":"2 PICKS"}
function addWeekCells(tr,week,p,weekResults,storedResults,isCurrent){const d=pickData(p,week,weekResults,storedResults,isCurrent);const pc=document.createElement("td");pc.append(makePick(d.team1,d.r1),makePick(d.team2,d.r2));const s=document.createElement("td");s.className="statusCell";s.textContent=statusFor(d,isCurrent);if(isCurrent&&s.textContent==="PICKED")s.className+=" picked";if(!isCurrent&&s.textContent==="OUT")s.className+=" out";tr.append(pc,s)}
function key(name){return String(name||"").trim().toLowerCase()}
function render(allPlayers,weekRows,liveByWeek,stored,currentWeek){const weeks=$("weeks");weeks.innerHTML="";const wrap=document.createElement("div");wrap.className="tableWrap";const table=document.createElement("table");table.className="sheet";const thead=document.createElement("thead");const g=document.createElement("tr");g.innerHTML=`<th class="group w1 playerHead" rowspan="2">PLAYER</th><th class="group w1 weekHead">WEEK 1 • RESULTS</th><th class="group w1 statusHead">STATUS</th><th class="group current weekHead">WEEK ${currentWeek} • PICKS</th><th class="group current statusHead">STATUS</th>`;thead.appendChild(g);const h=document.createElement("tr");h.innerHTML=`<th>WEEK 1 RESULTS</th><th>STATUS</th><th>WEEK ${currentWeek} PICKS</th><th>STATUS</th>`;thead.appendChild(h);table.appendChild(thead);const body=document.createElement("tbody"),rows1=new Map((weekRows[1]||[]).map(p=>[key(p.name),p])),rowsC=new Map((weekRows[currentWeek]||[]).map(p=>[key(p.name),p]));allPlayers.forEach(base=>{const tr=document.createElement("tr"),n=document.createElement("td");n.textContent=base.name;tr.appendChild(n);addWeekCells(tr,1,rows1.get(key(base.name))||{},liveByWeek[1]||{},stored,false);addWeekCells(tr,currentWeek,rowsC.get(key(base.name))||{},liveByWeek[currentWeek]||{},stored,true);body.appendChild(tr)});table.appendChild(body);wrap.appendChild(table);weeks.appendChild(wrap)}
async function load(){try{const currentPlayers=await rpc("get_leaderboard",{})||[];const weekRows={};const{data:weekData}=await db.from("weeks").select("week_number").order("week_number",{ascending:false});let currentWeek=Number(weekData?.[0]?.week_number)||2;const needed=new Set([1,currentWeek]);for(const w of needed)weekRows[w]=await rpc("get_leaderboard_for_week",{p_week:w})||[];const stored=await fetchStoredResults(),liveByWeek=await fetchLiveNFLResults();const names=new Map();currentPlayers.forEach(p=>{if(p.name&&!names.has(key(p.name)))names.set(key(p.name),{name:p.name,status:p.status})});Object.values(weekRows).forEach(rows=>(rows||[]).forEach(p=>{if(p.name&&!names.has(key(p.name)))names.set(key(p.name),{name:p.name,status:p.status})}));const allPlayers=Array.from(names.values()).filter(p=>String(p.status||"").toUpperCase()!=="DROPPED");render(allPlayers,weekRows,liveByWeek,stored,currentWeek);$("notice").textContent=`WEEKS 1–${currentWeek} • SIDE-BY-SIDE • WEEK-SAFE • UPDATED AUTOMATICALLY`;}catch(e){console.error(e);$("notice").textContent="COULD NOT LOAD LEADERBOARD";$("msg").textContent=e.message||"Please try again."}}
const token=tokenFromUrl();if(token)$("back").href="./?token="+encodeURIComponent(token);load();setInterval(load,30000);
</script></body></html>
