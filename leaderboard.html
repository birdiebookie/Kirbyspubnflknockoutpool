<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Kirby's Knockout Pool — Live Leaderboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Arial,Calibri,sans-serif}
.wrap{width:98%;max-width:1200px;margin:14px auto 30px}
h1{font-size:28px;margin:0}.sub{font-size:15px;font-weight:800;margin:3px 0 12px}
.notice{background:#fff200;border:2px solid #111;padding:10px;font-weight:900;margin-bottom:10px}
.back{display:block;border:2px solid #666;background:#eee;color:#000;text-decoration:none;text-align:center;font-weight:900;padding:11px;margin-bottom:10px}
.tableWrap{width:100%;overflow-x:auto;border:2px solid #555}
.sheet{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed}
.sheet th,.sheet td{border:2px solid #666;padding:0;text-align:center;font-weight:900}
.sheet thead th{padding:9px;background:#eee}
.playerName{width:18%;text-align:left!important;padding:9px!important;font-size:17px}
.weekHead{background:#70ad47!important;font-size:17px}
.week1Head{background:#fff200!important}
.statusHead{width:13%}
.playerNameCell{text-align:left!important;padding:9px!important;font-size:17px;background:#eee}
.weekCell{padding:0!important;vertical-align:middle}
.pickslot{min-height:48px;padding:8px 5px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #777;font-size:16px;line-height:1.05}
.pickslot:last-child{border-bottom:0}
.weekStack{display:grid;width:100%;grid-template-rows:48px 48px}
.win{background:#fff200!important}.loss{background:#f00!important}.pending{background:#fff!important}
.status{padding:9px 5px;font-size:15px}.status.active{background:#70ad47}.status.out{background:#f00}
.activeRow td{background:#fff}.outRow td{background:#f5f5f5}
.outRow{opacity:.95}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;font-size:12px;font-weight:900}
.legend span{border:1px solid #777;padding:4px 8px}.legend .yellow{background:#fff200}.legend .red{background:#f00}.legend .green{background:#70ad47}.legend .white{background:#fff}
@media(max-width:700px){.wrap{width:99%}.sheet{min-width:760px}.pickslot{font-size:14px}.playerNameCell{font-size:15px}}
</style>
</head>
<body>
<div class="wrap">
<h1>KIRBY'S KNOCKOUT POOL</h1>
<div class="sub">NFL 2026 • LIVE LEADERBOARD</div>
<a id="back" class="back" href="./">← BACK TO MY PICKS</a>
<div id="notice" class="notice">LOADING...</div>
<div class="tableWrap"><table class="sheet"><thead id="head"></thead><tbody id="body"></tbody></table></div>
<div class="legend"><span class="yellow">WIN</span><span class="red">LOSS</span><span class="green">ACTIVE / PICKS AVAILABLE</span><span class="white">NOT PICKED</span></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://rkyupmpnsjjgditslpiz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_hicUgD5WOhRlbPtwMzkaqQ_WktOF7qL";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let myInfo=null;
function tokenFromUrl(){const q=new URLSearchParams(location.search);return q.get("token")||new URLSearchParams(location.hash.slice(1)).get("token")||""}
async function loadMe(){const token=tokenFromUrl();if(!token){myInfo=null;return}try{const rows=await rpc("get_my_info",{p_token:token});myInfo=Array.isArray(rows)&&rows.length?rows[0]:null}catch(e){myInfo=null}}
async function rpc(name,args){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
function key(v){return String(v||"").trim().toLowerCase()}
function clean(v){return String(v||"").replace(/\s+[-+]\d+(?:\.\d+)?\s*$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function resultFor(team,results){
 const k=clean(team);if(!k)return"";
 if(results[k])return results[k];
 for(const x of Object.keys(results||{})){const y=clean(x);if(k===y||k.endsWith(" "+y)||y.endsWith(" "+k))return results[x]}
 return"";
}
function weekFromDate(s){const d=new Date(s),start=new Date("2026-09-10T00:00:00-04:00");return Math.floor((d-start)/604800000)+1}
async function liveResults(){
 const out={};
 try{
  const now=new Date(),from=new Date(now-40*86400000),to=new Date(now+86400000);
  const fmt=d=>d.toISOString().slice(0,10).replaceAll("-","");
  const r=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates="+fmt(from)+"-"+fmt(to)+"&limit=1000",{cache:"no-store"});
  if(!r.ok)throw Error();
  const data=await r.json();
  for(const ev of data.events||[]){
   const st=ev.status?.type||{};
   if(!(st.completed||st.state==="post"||String(st.name||"").toUpperCase().includes("FINAL")))continue;
   const c=ev.competitions?.[0]?.competitors||[];if(c.length<2)continue;
   const a=c[0],b=c[1],sa=Number(a.score),sb=Number(b.score);if(!Number.isFinite(sa)||!Number.isFinite(sb)||sa===sb)continue;
   const w=Number(ev.week?.number||ev.competitions?.[0]?.week?.number||weekFromDate(ev.date));if(w<1||w>18)continue;
   if(!out[w])out[w]={};
   const win=sa>sb?a:b,lose=sa>sb?b:a;
   [win.team?.displayName,win.team?.shortDisplayName,win.team?.name,win.team?.abbreviation].forEach(x=>{if(x)out[w][clean(x)]="WIN"});
   [lose.team?.displayName,lose.team?.shortDisplayName,lose.team?.name,lose.team?.abbreviation].forEach(x=>{if(x)out[w][clean(x)]="LOSS"});
  }
 }catch(e){console.warn("Live results unavailable",e)}
 return out;
}
async function storedResults(){
 try{const r=await fetch("./nfl-results.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return{};const j=await r.json();return j.results||j.weeks||j||{}}catch(e){return{}}
}
function pickResult(p,week,live,stored){
 let r1="",r2="";
 const wr=live[week]||{},sr=(stored.weeks&&stored.weeks[String(week)])||stored[String(week)]||stored;
 if(p?.team1)r1=resultFor(p.team1,wr)||resultFor(p.team1,sr)||String(p.team1_result||"").toUpperCase();
 if(p?.team2)r2=resultFor(p.team2,wr)||resultFor(p.team2,sr)||String(p.team2_result||"").toUpperCase();
 return [r1,r2];
}
function makeSlot(team,result,hidden){
 const d=document.createElement("div");d.className="pickslot pending";
 if(hidden){d.textContent="NOT PICKED";return d}
 d.textContent=team||"NOT PICKED";
 if(result==="WIN")d.className="pickslot win";
 if(result==="LOSS")d.className="pickslot loss";
 return d;
}
function getRule(name,rows,current,live,stored){
 let failures=0;
 for(let w=1;w<current;w++){
  const p=(rows[w]||[]).find(x=>key(x.name)===key(name))||{};
  const [r1,r2]=pickResult(p,w,live,stored);
  if(p.team1&&r1==="LOSS")failures++;
  if(p.team2&&r2==="LOSS")failures++;
 }
 const allowed=Math.max(0,2-failures);
 return {allowed,out:failures>=2};
}
function render(rows,current,live,stored){
 const names=new Map();
 Object.values(rows).forEach(list=>(list||[]).forEach(p=>{if(p.name&&!names.has(key(p.name)))names.set(key(p.name),p.name)}));
 const players=[...names.values()];
 const records=players.map(name=>{
  const latest=(rows[current]||[]).find(x=>key(x.name)===key(name))||{};
  const storedStatus=String(latest.status||"").trim().toUpperCase();
  const rule=getRule(name,rows,current,live,stored);
  // The database status is authoritative for OUT/DROPPED placement.
  // This is display/order logic only; historical picks remain untouched.
  return {name,rule,storedStatus,isOut:storedStatus==="OUT"||storedStatus==="DROPPED"||rule.out};
 });
 records.sort((a,b)=>{
  if(a.isOut!==b.isOut)return a.isOut?1:-1;
  if(a.rule.allowed!==b.rule.allowed)return b.rule.allowed-a.rule.allowed;
  return a.name.localeCompare(b.name);
 });
 const h=document.createElement("tr");
 const n=document.createElement("th");n.className="playerName";n.textContent="PLAYER";h.appendChild(n);
 for(let w=1;w<=current;w++){const th=document.createElement("th");th.className="weekHead "+(w===1?"week1Head":"");th.textContent="WEEK "+w;h.appendChild(th)}
 const st=document.createElement("th");st.className="statusHead";st.textContent="STATUS";h.appendChild(st);
 $("head").innerHTML="";$("head").appendChild(h);
 const body=$("body");body.innerHTML="";
 for(const rec of records){
  const tr=document.createElement("tr");tr.className=rec.isOut?"outRow":"activeRow";
  const nm=document.createElement("td");nm.className="playerNameCell";nm.textContent=rec.name;tr.appendChild(nm);
  for(let w=1;w<=current;w++){
   const p=(rows[w]||[]).find(x=>key(x.name)===key(rec.name))||{};
   const [r1,r2]=pickResult(p,w,live,stored);
   const td=document.createElement("td");td.className="weekCell";
   const stack=document.createElement("div");stack.className="weekStack";
   const isCurrent=w===current;
   const hideCurrent=!rec.rule.out && isCurrent && (!myInfo || key(rec.name)!==key(myInfo.name));
   const firstSlot=makeSlot(p.team1,r1,hideCurrent);
   // HISTORY ONLY: Week 2 first pick slot shows plain red NOT PICKED when no pick was made.
   // Do not affect Week 1, Week 3, Week 2 second slot, or any pick/result logic.
   if(w===2 && !isCurrent && !p.team1)firstSlot.className="pickslot loss";

   // DISPLAY ONLY: when a player has one pick left, place the current week's
   // actual pick in the same visual row as the surviving prior-week winner.
   // The underlying slot/team data is NOT changed.
   if(isCurrent && rec.rule.allowed===1 && !rec.rule.out){
     let survivorRow=1;
     const prior=(rows[w-1]||[]).find(x=>key(x.name)===key(rec.name))||{};
     const [pr1,pr2]=pickResult(prior,w-1,live,stored);
     if(pr1==="WIN")survivorRow=1;
     else if(pr2==="WIN")survivorRow=2;
     firstSlot.style.gridRow=String(survivorRow);
     firstSlot.style.gridColumn="1";
     const spacer=document.createElement("div");
     spacer.className="pickslot pending";
     spacer.textContent="NOT PICKED";
     spacer.style.gridRow=String(survivorRow===1?2:1);
     spacer.style.gridColumn="1";
     stack.appendChild(firstSlot);
     stack.appendChild(spacer);
   }else{
     firstSlot.style.gridRow="1";
     firstSlot.style.gridColumn="1";
     const secondSlot=makeSlot(p.team2,r2,hideCurrent);
     secondSlot.style.gridRow="2";
     secondSlot.style.gridColumn="1";
     stack.appendChild(firstSlot);
     stack.appendChild(secondSlot);
   }
   if(isCurrent && rec.isOut){
     stack.innerHTML="";
     stack.appendChild(makeSlot("", "", true));
     stack.appendChild(makeSlot("", "", true));
   }
   td.appendChild(stack);
   tr.appendChild(td);
  }
  const s=document.createElement("td");s.className="status "+(rec.rule.out?"out":"active");
  s.textContent=rec.isOut?"OUT":(rec.rule.allowed===1?"1 PICK LEFT":"2 PICKS LEFT");
  tr.appendChild(s);body.appendChild(tr);
 }
 $("notice").textContent="WEEKS 1–"+current+" • ACTIVE PLAYERS FIRST • OUT PLAYERS AT BOTTOM • PICKS SIDE-BY-SIDE";
}
async function load(){
 try{
  await loadMe();
  const currentPlayers=await rpc("get_leaderboard",{})||[];
  const {data:weekData,error}=await db.from("weeks").select("week_number").order("week_number",{ascending:false});
  if(error)throw error;
  const current=Number(weekData?.[0]?.week_number)||3;
  const rows={};
  for(let w=1;w<=current;w++)rows[w]=await rpc("get_leaderboard_for_week",{p_week:w})||[];
  const [live,stored]=await Promise.all([liveResults(),storedResults()]);
  render(rows,current,live,stored);
 }catch(e){console.error(e);$("notice").textContent="COULD NOT LOAD LEADERBOARD: "+(e.message||"");}
}
const q=new URLSearchParams(location.search),t=q.get("token")||new URLSearchParams(location.hash.slice(1)).get("token");if(t)$("back").href="./?token="+encodeURIComponent(t);
load();setInterval(load,30000);
</script>
</body>
</html>
