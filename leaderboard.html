<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kirby's Knockout Pool — Leaderboard</title>
<style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Calibri,Arial,sans-serif;font-size:15px}.wrap{width:min(950px,96%);margin:18px auto 40px}h1{font-size:27px;margin:0}.sub{font-size:13px;font-weight:700;margin:2px 0 12px}.notice{font-size:13px;font-weight:700;background:#fff200;border:1px solid #111;padding:7px 9px;margin-bottom:10px}.top{margin-bottom:12px}.back{display:inline-block;border:1px solid #666;background:#eee;color:#000;text-decoration:none;font-weight:700;padding:8px 12px}.weekBox{margin:16px 0 20px;border:1px solid #777}.weekTitle{background:#fff200;border-bottom:1px solid #111;font-size:18px;font-weight:900;padding:9px}.weekTitle.current{background:#70ad47}.sheet{width:100%;border-collapse:collapse;table-layout:fixed}.sheet th,.sheet td{border:1px solid #777;padding:0;text-align:left;font-weight:700}.sheet th{background:#eee;padding:7px 8px}.player{width:38%}.week{width:42%}.status{width:20%;text-align:center}.pickslot{min-height:38px;padding:7px 8px;border-bottom:1px solid #777;background:#fff;text-align:center}.pickslot:last-child{border-bottom:0}.win{background:#fff200!important}.loss,.out{background:#f00!important}.pending{background:#fff!important}.legend{margin-top:12px;font-weight:700}.legend span{display:inline-block;padding:4px 9px;border:1px solid #777;margin-right:6px}.yellow{background:#fff200}.red{background:#f00}.white{background:#fff}.msg{font-weight:700;margin:10px 0}</style></head>
<body><div class="wrap"><h1>KIRBY'S KNOCKOUT POOL</h1><div class="sub">NFL 2026 • LIVE LEADERBOARD</div><div class="top"><a id="back" class="back" href="./">← BACK TO MY PICKS</a></div><div id="notice" class="notice">LOADING LEADERBOARD...</div><div id="msg" class="msg"></div><div id="weeks"></div><div class="legend"><span class="yellow">WIN</span><span class="red">LOSS</span><span class="white">PENDING</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";
const SUPABASE_URL="https://rkyupmpnsjjgditslpiz.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_hicUgD5WOhRlbPtwMzkaqQ_WktOF7qL",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY),$=id=>document.getElementById(id);
async function rpc(name,args){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
function tokenFromUrl(){const q=new URLSearchParams(location.search);return q.get("token")||new URLSearchParams(location.hash.substring(1)).get("token")||""}
function cleanTeam(s){return String(s||"").replace(/\s+[-+]\d+(?:\.\d+)?\s*$/g,"").replace(/\s+/g," ").trim().toLowerCase()}
function addResult(results,name,res){if(!name)return;const k=cleanTeam(name);if(k)results[k]=res}
async function fetchLiveNFLResults(){
 const byWeek={};
 try{
  const now=new Date(),from=new Date(now.getTime()-35*86400000),to=new Date(now.getTime()+1*86400000),fmt=d=>d.toISOString().slice(0,10).replaceAll("-","");
  const url=`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${fmt(from)}-${fmt(to)}&limit=1000`;
  const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw Error("ESPN HTTP "+r.status);const data=await r.json();
  for(const ev of(data.events||[])){
   const st=ev.status?.type||{};if(!(st.completed||st.state==="post"||String(st.name||"").toUpperCase().includes("FINAL")))continue;
   const teams=ev.competitions?.[0]?.competitors||[];if(teams.length<2)continue;
   const a=teams[0],b=teams[1],sa=Number(a.score),sb=Number(b.score);if(!Number.isFinite(sa)||!Number.isFinite(sb)||sa===sb)continue;
   const wk=Number(ev.week?.number||ev.competitions?.[0]?.week?.number||0);if(!wk)continue;
   if(!byWeek[wk])byWeek[wk]={};
   const winner=sa>sb?a:b,loser=sa>sb?b:a,wx=winner.team||{},lx=loser.team||{};
   [wx.displayName,wx.shortDisplayName,wx.name,wx.abbreviation].forEach(n=>addResult(byWeek[wk],n,"WIN"));
   [lx.displayName,lx.shortDisplayName,lx.name,lx.abbreviation].forEach(n=>addResult(byWeek[wk],n,"LOSS"));
  }
 }catch(e){console.warn("Live ESPN results unavailable",e)}
 return byWeek;
}
async function fetchStoredResults(){try{const r=await fetch("./nfl-results.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error();return(await r.json()).results||{}}catch(e){return{}}}
function resultForTeam(team,results){const k=cleanTeam(team);if(!k)return"";if(results[k])return results[k];for(const x of Object.keys(results)){const y=cleanTeam(x);if(k===y||k.endsWith(" "+y)||y.endsWith(" "+k))return results[x]}return""}
function key(name){return String(name||"").trim().toLowerCase()}
function makePick(team,result){const d=document.createElement("div"),r=String(result||"").trim().toUpperCase();d.className="pickslot pending";d.textContent=team||"Pending";if(r==="WIN")d.className="pickslot win";else if(r==="LOSS")d.className="pickslot loss";return d}
function makeWeekBox(week,rows,allPlayers,weekResults,storedResults,isCurrent){
 const byName=new Map(rows.map(p=>[key(p.name),p]));
 const box=document.createElement("div");box.className="weekBox";
 const title=document.createElement("div");title.className="weekTitle"+(isCurrent?" current":"");title.textContent=isCurrent?`WEEK ${week} • PICKS • UPDATED AUTOMATICALLY`:`WEEK ${week} • RESULTS`;box.appendChild(title);
 const table=document.createElement("table");table.className="sheet";table.innerHTML=`<thead><tr><th class="player">PLAYER</th><th class="week">WEEK ${week} ${isCurrent?"— PICKS":"— RESULTS"}</th><th class="status">STATUS</th></tr></thead>`;
 const body=document.createElement("tbody");
 allPlayers.forEach(base=>{
   const p=byName.get(key(base.name))||{};const team1=p.team1||"",team2=p.team2||"";
   // NEVER use a previous week's result for a current-week pick.
   const live1=team1?resultForTeam(team1,weekResults):"",live2=team2?resultForTeam(team2,weekResults):"";
   let r1=live1||String(p.team1_result||"").trim().toUpperCase();let r2=live2||String(p.team2_result||"").trim().toUpperCase();
   // nfl-results.json is the saved Week 1 result source only.
   if(week===1){if(team1&&!r1)r1=resultForTeam(team1,storedResults);if(team2&&!r2)r2=resultForTeam(team2,storedResults)}
   const has1=!!team1,has2=!!team2,finished1=!!r1,finished2=!!r2,wins=(r1==="WIN"?1:0)+(r2==="WIN"?1:0);
   const tr=document.createElement("tr"),n=document.createElement("td");n.textContent=base.name;
   const pc=document.createElement("td");pc.append(makePick(team1,r1),makePick(team2,r2));
   const s=document.createElement("td");
   if(!has1&&!has2)s.textContent="PENDING";
   else if(isCurrent && (!finished1||!finished2))s.textContent=has1&&has2?"PENDING":"1 PICK";
   else if(!isCurrent && (!finished1||!finished2))s.textContent=has1||has2?"1 PICK":"PENDING";
   else s.textContent=wins===0?"OUT":wins===1?"1 PICK":"2 PICKS";
   if(s.textContent==="OUT")s.className="out";
   tr.append(n,pc,s);body.appendChild(tr);
 });
 table.appendChild(body);box.appendChild(table);return box;
}
async function load(){try{
 const currentPlayers=await rpc("get_leaderboard",{})||[];
 const weekRows=[];for(let w=1;w<=2;w++)weekRows[w]=await rpc("get_leaderboard_for_week",{p_week:w})||[];
 const maxWeekRows=await rpc("get_leaderboard_for_week",{p_week:2})||[];
 const stored=await fetchStoredResults(),liveByWeek=await fetchLiveNFLResults();
 // The weeks table is the authoritative source for which week is current. Do not rely on get_leaderboard's week_number.
 let currentWeek=2;
 try{const{data,error}=await db.from("weeks").select("week_number").order("week_number",{ascending:false}).limit(1);if(!error&&data&&data.length)currentWeek=Number(data[0].week_number)||2}catch(e){}
 const names=new Map();
 currentPlayers.forEach(p=>{if(p.name&&!names.has(key(p.name)))names.set(key(p.name),{name:p.name,status:p.status,picks_remaining:p.picks_remaining})});
 weekRows[1].forEach(p=>{if(p.name&&!names.has(key(p.name)))names.set(key(p.name),{name:p.name,status:p.status,picks_remaining:p.picks_remaining})});
 maxWeekRows.forEach(p=>{if(p.name&&!names.has(key(p.name)))names.set(key(p.name),{name:p.name,status:p.status,picks_remaining:p.picks_remaining})});
 const allPlayers=Array.from(names.values()).filter(p=>String(p.status||"").toUpperCase()!=="DROPPED");
 const weeks=$("weeks");weeks.innerHTML="";
 for(let w=1;w<=currentWeek;w++){
   const rows=weekRows[w]||await rpc("get_leaderboard_for_week",{p_week:w})||[];
   weeks.appendChild(makeWeekBox(w,rows,allPlayers,liveByWeek[w]||{},stored,w===currentWeek));
 }
 $("notice").textContent=`WEEKS 1–${currentWeek} • LIVE • UPDATED AUTOMATICALLY`;
 }catch(e){$("notice").textContent="COULD NOT LOAD LEADERBOARD";$("msg").textContent=e.message||"Please try again."}}
const token=tokenFromUrl();if(token)$("back").href="./?token="+encodeURIComponent(token);load();setInterval(load,30000);
</script></body></html>
