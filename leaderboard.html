<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Kirby's Knockout Pool — Live Leaderboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Arial,Calibri,sans-serif}
.wrap{width:98%;max-width:900px;margin:14px auto 30px}
h1{font-size:28px;margin:0}.sub{font-size:15px;font-weight:800;margin:3px 0 12px}
.notice{background:#fff200;border:2px solid #111;padding:10px;font-weight:900;margin-bottom:10px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 12px}
.stat{border:2px solid #555;text-align:center;padding:8px 4px;background:#eee;font-weight:900}
.stat b{display:block;font-size:24px;line-height:1.05}.stat span{display:block;font-size:10px;margin-top:3px}
@media(max-width:520px){.summary{grid-template-columns:repeat(2,1fr)}}
.back{display:block;border:2px solid #666;background:#eee;color:#000;text-decoration:none;text-align:center;font-weight:900;padding:11px;margin-bottom:10px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;font-size:12px;font-weight:900}
.legend span{border:1px solid #777;padding:4px 8px}.win{background:#fff200!important}.loss{background:#f00!important}.picked{background:#70ad47!important}
.player{border:2px solid #555;margin:10px 0;background:#fff}
.playerTop{display:flex;justify-content:space-between;align-items:center;background:#eee;border-bottom:2px solid #555;padding:9px 10px}
.name{font-size:18px;font-weight:900}.status{font-size:13px;font-weight:900;padding:5px 7px;border:1px solid #555;background:#fff}
.status.out{background:#f00}.status.active{background:#70ad47}
.weekTitle{font-size:15px;font-weight:900;padding:7px 9px;border-bottom:1px solid #777}
.weekTitle.w1{background:#fff200}.weekTitle.w2{background:#70ad47}
.picks{display:grid;grid-template-columns:1fr 1fr}
.pick{min-height:58px;border-right:1px solid #777;border-bottom:1px solid #777;display:flex;align-items:center;justify-content:center;text-align:center;padding:7px;font-size:17px;font-weight:900}
.pick:nth-child(2n){border-right:0}
.pick small{display:block;font-size:10px}
.section{border-bottom:2px solid #555}
.section:last-child{border-bottom:0}
.empty{background:#fff!important}
@media(min-width:700px){.player{display:grid;grid-template-columns:170px 1fr 1fr}.playerTop{grid-row:1 / span 2;display:block;border-right:2px solid #555;border-bottom:0}.status{margin-top:8px;text-align:center}.section{border-bottom:0;border-right:2px solid #555}.section:last-child{border-right:0}}
</style>
</head>
<body>
<div class="wrap">
<h1>KIRBY'S KNOCKOUT POOL</h1>
<div class="sub">NFL 2026 • LIVE LEADERBOARD</div>
<a id="back" class="back" href="./">← BACK TO MY PICKS</a>
<div id="notice" class="notice">LOADING...</div>
<div class="summary">
  <div class="stat"><b id="statTotal">-</b><span>TOTAL PLAYERS</span></div>
  <div class="stat"><b id="statOut">-</b><span>OUT</span></div>
  <div class="stat"><b id="statOne">-</b><span>1 PICK LEFT</span></div>
  <div class="stat"><b id="statTwo">-</b><span>2 PICKS LEFT</span></div>
</div>
<div class="legend"><span class="win">WIN</span><span class="loss">LOSS / XXX</span><span class="picked">PICKED</span><span>NOT PICKED</span></div>
<div id="players"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
const SUPABASE_URL="https://rkyupmpnsjjgditslpiz.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_hicUgD5WOhRlbPtwMzkaqQ_WktOF7qL";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
async function rpc(name,args){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}
function key(v){return String(v||"").trim().toLowerCase()}
function token(){const q=new URLSearchParams(location.search);return q.get("token")||new URLSearchParams(location.hash.slice(1)).get("token")||""}
function clean(v){return String(v||"").replace(/\s+[-+]\d+(?:\.\d+)?\s*$/,"").replace(/\s+/g," ").trim().toLowerCase()}
function resultFor(team,results){const k=clean(team);if(!k)return"";if(results[k])return results[k];for(const x of Object.keys(results)){const y=clean(x);if(k===y||k.endsWith(" "+y)||y.endsWith(" "+k))return results[x]}return""}
async function storedResults(){try{const r=await fetch("./nfl-results.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return{};return await r.json()}catch(e){return{}}}
function weekFromDate(s){const d=new Date(s),start=new Date("2026-09-10T00:00:00-04:00");return Math.floor((d-start)/604800000)+1}
async function liveResults(){
 const out={};
 try{
  const now=new Date(),from=new Date(now-35*86400000),to=new Date(now+86400000);
  const fmt=d=>d.toISOString().slice(0,10).replaceAll("-","");
  const r=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates="+fmt(from)+"-"+fmt(to)+"&limit=1000",{cache:"no-store"});
  if(!r.ok)throw Error();
  const data=await r.json();
  for(const ev of data.events||[]){
   const st=ev.status?.type||{};
   if(!(st.completed||st.state==="post"||String(st.name||"").toUpperCase().includes("FINAL")))continue;
   const c=ev.competitions?.[0]?.competitors||[];if(c.length<2)continue;
   const a=c[0],b=c[1],sa=Number(a.score),sb=Number(b.score);if(!Number.isFinite(sa)||!Number.isFinite(sb)||sa===sb)continue;
   const w=weekFromDate(ev.date);if(w<1||w>18)continue;if(!out[w])out[w]={};
   const win=sa>sb?a:b,lose=sa>sb?b:a;
   [win.team?.displayName,win.team?.shortDisplayName,win.team?.name,win.team?.abbreviation].forEach(x=>{if(x)out[w][clean(x)]="WIN"});
   [lose.team?.displayName,lose.team?.shortDisplayName,lose.team?.name,lose.team?.abbreviation].forEach(x=>{if(x)out[w][clean(x)]="LOSS"});
  }
 }catch(e){}
 return out;
}
function priorRule(name,rows,current){
 let losses=0,missing=0,wins=0;
 for(let w=1;w<current;w++){
  const p=(rows[w]||[]).find(x=>key(x.name)===key(name))||{};
  for(const slot of [1,2]){
   const t=slot===1?p.team1:p.team2;
   const r=String(slot===1?p.team1_result:p.team2_result||"").toUpperCase();
   if(!t){missing++;continue}
   if(r==="LOSS")losses++; else if(r==="WIN")wins++;
  }
 }
 const unavailable=Math.min(2,losses+missing);
 return {allowed:Math.max(0,2-unavailable),out:losses+missing>=2,wins};
}
function liveStats(rows,current,live,stored,all){
 let out=0,one=0,two=0;
 for(const base of all){
  const rule=priorRule(base.name,rows,current);
  if(rule.out){out++;continue}
  const cur=(rows[current]||[]).find(p=>key(p.name)===key(base.name))||{};
  let remaining=rule.allowed;
  for(const team of [cur.team1,cur.team2]){
   if(!team)continue;
   const r=resultFor(team,live[current]||{})||resultFor(team,stored.weeks?.[String(current)]||{})||"";
   if(r==="LOSS")remaining=Math.max(0,remaining-1);
  }
  if(remaining<=0)out++; else if(remaining===1)one++; else two++;
 }
 return {total:all.length,out,one,two};
}
function makePick(team,result,dead,hide,placeholder){
 const d=document.createElement("div");d.className="pick empty";
 if(dead){d.className="pick loss";d.innerHTML="<strong>XXX</strong><small>PICK LOST</small>";return d}
 if(hide&&team){d.className="pick picked";d.textContent="PICKED";return d}
 d.textContent=team||placeholder||"NOT PICKED";
 if(result==="WIN")d.className="pick win";
 if(result==="LOSS")d.className="pick loss";
 return d;
}
function render(rows,current,live,stored,myName){
 const root=$("players");root.innerHTML="";
 const names=new Map();
 (rows[current]||[]).forEach(p=>{if(p.name)names.set(key(p.name),p)});
 (rows[1]||[]).forEach(p=>{if(p.name&&!names.has(key(p.name)))names.set(key(p.name),p)});
 const all=[...names.values()].filter(p=>String(p.status||"").toUpperCase()!=="DROPPED");
 const stats=liveStats(rows,current,live,stored,all);
 $("statTotal").textContent=stats.total;
 $("statOut").textContent=stats.out;
 $("statOne").textContent=stats.one;
 $("statTwo").textContent=stats.two;
 const lockTime=(rows[current]||[])[0]?.lock_time; const reveal=lockTime ? new Date(lockTime)<=new Date() : true;
 for(const base of all){
  const name=base.name,rule=priorRule(name,rows,current),cur=(rows[current]||[]).find(p=>key(p.name)===key(name))||{},w1=(rows[1]||[]).find(p=>key(p.name)===key(name))||{};
  const card=document.createElement("div");card.className="player";
  const top=document.createElement("div");top.className="playerTop";
  const nm=document.createElement("div");nm.className="name";nm.textContent=name;
  const st=document.createElement("div");st.className="status "+(rule.out?"out":"active");
  const made=!!(cur.team1||cur.team2);st.textContent=rule.out?"OUT":made?(rule.allowed===1?"1 PICK MADE":"2 PICKS MADE"):"NOT PICKED";
  top.append(nm,st);card.appendChild(top);
  const sec1=document.createElement("div");sec1.className="section";
  const t1=document.createElement("div");t1.className="weekTitle w1";t1.textContent="WEEK 1";sec1.appendChild(t1);
  const p1=document.createElement("div");p1.className="picks";
  const r11=resultFor(w1.team1,live[1]||{})||resultFor(w1.team1,stored.weeks?.["1"]||stored.results||{})||String(w1.team1_result||"").toUpperCase();
  const r12=resultFor(w1.team2,live[1]||{})||resultFor(w1.team2,stored.weeks?.["1"]||stored.results||{})||String(w1.team2_result||"").toUpperCase();
  p1.append(makePick(w1.team1,r11,false,false),makePick(w1.team2,r12,false,false));sec1.appendChild(p1);card.appendChild(sec1);
  const sec2=document.createElement("div");sec2.className="section";
  const t2=document.createElement("div");t2.className="weekTitle w2";t2.textContent="WEEK "+current;sec2.appendChild(t2);
  const p2=document.createElement("div");p2.className="picks";
  const dead1=rule.out&&!cur.team1,dead2=rule.out&&!cur.team2;
  const r21=String(cur.team1_result||"").toUpperCase()||resultFor(cur.team1,live[current]||{})||resultFor(cur.team1,stored.weeks?.[String(current)]||{})||""; const r22=String(cur.team2_result||"").toUpperCase()||resultFor(cur.team2,live[current]||{})||resultFor(cur.team2,stored.weeks?.[String(current)]||{})||""; p2.append(makePick(cur.team1,r21,dead1,false,"NOT PICKED"),makePick(cur.team2,r22,dead2,false,"NOT PICKED"));
  sec2.appendChild(p2);card.appendChild(sec2);\n  const sec3=document.createElement("div");sec3.className="section";\n  const t3=document.createElement("div");t3.className="weekTitle";t3.textContent="WEEK 3";sec3.appendChild(t3);\n  const p3=document.createElement("div");p3.className="picks";\n  const w3=(rows[3]||[]).find(p=>key(p.name)===key(name))||{};\n  p3.append(makePick(w3.team1,"",rule.out||rule.allowed<1,false,"NOT PICKED"),makePick(w3.team2,"",rule.out||rule.allowed<2,false,"NOT PICKED"));\n  sec3.appendChild(p3);card.appendChild(sec3);root.appendChild(card);
 }
 $("notice").textContent="WEEKS 1–"+current+" • CURRENT PICKS "+(reveal?"VISIBLE":"HIDDEN")+" • UPDATES AUTOMATICALLY";
}
async function load(){
 try{
  const currentList=await rpc("get_leaderboard",{})||[];
  const current=Number(currentList[0]?.week_number)||2;
  const rows={1:await rpc("get_leaderboard_for_week",{p_week:1})||[]};
  rows[current]=current===1?rows[1]:await rpc("get_leaderboard_for_week",{p_week:current})||[];\n  try{rows[3]=await rpc("get_leaderboard_for_week",{p_week:3})||[]}catch(e){rows[3]=[]}
  let myName="";
  const t=token();if(t){try{const me=await rpc("get_my_info",{p_token:t});if(Array.isArray(me)&&me[0])myName=me[0].name||""}catch(e){}}
  const [live,stored]=await Promise.all([liveResults(),storedResults()]);
  render(rows,current,live,stored,myName);
 }catch(e){$("notice").textContent="COULD NOT LOAD LEADERBOARD";console.error(e)}
}
const t=token();if(t)$("back").href="./?token="+encodeURIComponent(t);
load();setInterval(load,30000);
</script>
</body>
</html>
