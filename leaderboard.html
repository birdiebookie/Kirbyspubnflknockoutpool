<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Kirby's Knockout Pool — Leaderboard</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#000;font-family:Calibri,Arial,sans-serif;font-size:15px}.wrap{width:min(950px,96%);margin:18px auto 40px}h1{font-size:27px;margin:0}.sub{font-size:13px;font-weight:700;margin:2px 0 12px}.notice{font-size:13px;font-weight:700;background:#fff200;border:1px solid #111;padding:7px 9px;margin-bottom:10px}.top{display:flex;gap:8px;margin-bottom:12px}.back{display:inline-block;border:1px solid #666;background:#eee;color:#000;text-decoration:none;font-weight:700;padding:8px 12px}.sheet{width:100%;border-collapse:collapse;table-layout:fixed}.sheet th,.sheet td{border:1px solid #777;padding:7px 8px;text-align:left;font-weight:700}.sheet th{background:#eee}.sheet .player{width:38%}.sheet .pick{width:27%}.sheet .status{width:8%;text-align:center}.win{background:#fff200!important}.loss{background:#f00!important}.out{background:#f00!important}.hiddenpick{background:#f4f4f4!important;color:#555}.legend{margin-top:12px;font-weight:700}.legend span{display:inline-block;padding:4px 9px;border:1px solid #777;margin-right:6px}.yellow{background:#fff200}.red{background:#f00}.msg{font-weight:700;margin:10px 0}@media(max-width:650px){.sheet th,.sheet td{padding:6px 5px;font-size:13px}.sheet .player{width:34%}.sheet .pick{width:30%}.sheet .status{width:10%}}
</style></head><body><div class="wrap"><h1>KIRBY'S KNOCKOUT POOL</h1><div class="sub">NFL 2026 • LEADERBOARD</div><div class="top"><a id="back" class="back" href="./">← BACK TO MY PICKS</a></div><div id="notice" class="notice">LOADING LEADERBOARD...</div><div id="msg" class="msg"></div><table class="sheet"><thead><tr><th class="player">PLAYER</th><th class="pick">1ST TEAM</th><th class="pick">2ND TEAM</th><th class="status">STATUS</th></tr></thead><tbody id="body"></tbody></table><div class="legend"><span class="yellow">WIN</span><span class="red">LOSS / OUT</span></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
"use strict";const SUPABASE_URL="https://rkyupmpnsjjgditslpiz.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_hicUgD5WOhRlbPtwMzkaqQ_WktOF7qL",db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);async function rpc(name,args){const{data,error}=await db.rpc(name,args);if(error)throw error;return data}function tokenFromUrl(){const q=new URLSearchParams(location.search);return q.get("token")||new URLSearchParams(location.hash.substring(1)).get("token")||""}function locked(lock){return lock?new Date(lock)<=new Date():true}async function load(){try{const rows=await rpc("get_leaderboard",{})||[];const reveal=locked(rows[0]?.lock_time);if(rows.length){$("notice").textContent=`WEEK ${rows[0].week_number||1} • ${reveal?"PICKS AND RESULTS ARE LIVE":"PICKS ARE HIDDEN UNTIL SUNDAY AT 1:00 PM EASTERN"}`}else{$("notice").textContent="NO PLAYERS YET"}const b=$("body");b.innerHTML="";rows.filter(p=>p.status!=="DROPPED").forEach(p=>{const tr=document.createElement("tr");const n=document.createElement("td");n.textContent=p.name;const a=document.createElement("td");const c=document.createElement("td");const s=document.createElement("td");s.textContent=p.status||"";s.className=p.status==="OUT"?"out":"";if(reveal){a.textContent=p.team1||"";c.textContent=p.team2||"";if(p.team1_result==="WIN")a.classList.add("win");if(p.team1_result==="LOSS")a.classList.add("loss");if(p.team2_result==="WIN")c.classList.add("win");if(p.team2_result==="LOSS")c.classList.add("loss")}else{a.textContent="PICK HIDDEN";c.textContent="PICK HIDDEN";a.className=c.className="hiddenpick"}tr.append(n,a,c,s);b.appendChild(tr)})}catch(e){$("notice").textContent="COULD NOT LOAD LEADERBOARD";$("msg").textContent=e.message||"Please try again."}}const token=tokenFromUrl();if(token)$("back").href="./?token="+encodeURIComponent(token);load();setInterval(load,30000);
</script></body></html>
